---
# AWS Free Plan project region (confirm in AWS Settings) and your AWS CLI profile.
aws_profile: devops-lab
aws_region: ap-southeast-2
aws_cluster_name: devops-ite-k8s

# Use only your own public IP, e.g. "203.0.113.10/32".
# Pass via -e ssh_allowed_cidr="$(curl -4 -s https://checkip.amazonaws.com)/32"
ssh_allowed_cidr: CHANGE_ME

# Existing local SSH key will be imported as an EC2 key pair.
ssh_public_key_path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
ssh_private_key_path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
ec2_key_name: "{{ aws_cluster_name }}-key"
ansible_ssh_user: ubuntu

# Ubuntu 24.04 LTS AMD64 image is resolved dynamically through AWS SSM.
ubuntu_ami_ssm_parameter: /aws/service/canonical/ubuntu/server/noble/stable/current/amd64/hvm/ebs-gp3/ami-id


# ============================================
# EC2 Machine Specifications
# ============================================

machine_specs:
  master:
    instance_type: m7i-flex.large
    disk_gb: 45
    disk_type: gp3

  worker:
    instance_type: c7i-flex.large
    disk_gb: 45
    disk_type: gp3

# ============================================
# Kubernetes Cluster Nodes
# ============================================

machines_info:

  # ---------- Control Plane ----------

  - name: master01
    role: master
    zone: ap-southeast-2a
    instance_type: "{{ machine_specs.master.instance_type }}"
    disk_gb: "{{ machine_specs.master.disk_gb }}"
    disk_type: "{{ machine_specs.master.disk_type }}"

  - name: master02
    role: master
    zone: ap-southeast-2b
    instance_type: "{{ machine_specs.master.instance_type }}"
    disk_gb: "{{ machine_specs.master.disk_gb }}"
    disk_type: "{{ machine_specs.master.disk_type }}"

  - name: master03
    role: master
    zone: ap-southeast-2c
    instance_type: "{{ machine_specs.master.instance_type }}"
    disk_gb: "{{ machine_specs.master.disk_gb }}"
    disk_type: "{{ machine_specs.master.disk_type }}"

  # ---------- Worker Nodes ----------

  - name: worker01
    role: worker
    zone: ap-southeast-2a
    instance_type: "{{ machine_specs.worker.instance_type }}"
    disk_gb: "{{ machine_specs.worker.disk_gb }}"
    disk_type: "{{ machine_specs.worker.disk_type }}"

  # Keep for future use when quota increases
  - name: worker02
    role: worker
    zone: ap-southeast-2b
    instance_type: "{{ machine_specs.worker.instance_type }}"
    disk_gb: "{{ machine_specs.worker.disk_gb }}"
    disk_type: "{{ machine_specs.worker.disk_type }}"
