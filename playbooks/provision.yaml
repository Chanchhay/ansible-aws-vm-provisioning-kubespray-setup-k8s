---
- name: Provision AWS EC2 nodes for Kubespray
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - ../vars/aws.yaml

  vars:
    # Override to select a smaller lab; defaults to all five nodes.
    target_node_names: [master01, master02, worker01, worker02]
    confirm_provision: false
    target_nodes: "{{ machines_info | selectattr('name', 'in', target_node_names) | list }}"

  tasks:
    - name: Require confirmation and secure SSH access
      ansible.builtin.assert:
        that:
          - confirm_provision | bool
          - ssh_allowed_cidr != 'CHANGE_ME'
          - ssh_allowed_cidr != '0.0.0.0/0'
          - ssh_allowed_cidr is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}/(3[0-2]|[12]?[0-9])$')
          - target_nodes | length > 0
        fail_msg: >-
          Set ssh_allowed_cidr to your public IPv4/32, select nodes,
          and pass -e confirm_provision=true after reviewing costs.

    - name: Confirm selected machines
      ansible.builtin.debug:
        msg: "Provision {{ target_nodes | map(attribute='name') | list }} in {{ aws_region }}"

    - name: Find the AWS default VPC
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        filters:
          is-default: 'true'
      register: default_vpc_info

    - name: Require a default VPC
      ansible.builtin.assert:
        that:
          - default_vpc_info.vpcs | length == 1
        fail_msg: "No default VPC found in {{ aws_region }}. Configure a VPC and public subnets before running this lab."

    - name: Find default subnets
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        filters:
          vpc-id: "{{ default_vpc_info.vpcs[0].vpc_id }}"
          default-for-az: 'true'
      register: default_subnets

    - name: Verify each requested AZ has a default subnet
      ansible.builtin.assert:
        that:
          - item.zone in (default_subnets.subnets | map(attribute='availability_zone') | list)
        fail_msg: "No default subnet found in {{ item.zone }}. Choose an available zone or create a public subnet."
      loop: "{{ target_nodes }}"
      loop_control:
        label: "{{ item.name }} => {{ item.zone }}"

    - name: Import local SSH public key to AWS EC2
      amazon.aws.ec2_key:
        name: "{{ ec2_key_name }}"
        key_material: "{{ lookup('ansible.builtin.file', ssh_public_key_path) }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        state: present

    - name: Create cluster security group
      amazon.aws.ec2_security_group:
        name: "{{ aws_cluster_name }}-nodes"
        description: "Kubespray lab nodes; SSH from trusted IP and full intra-cluster traffic"
        vpc_id: "{{ default_vpc_info.vpcs[0].vpc_id }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        state: present
        rules:
          - proto: tcp
            ports: [22]
            cidr_ip: "{{ ssh_allowed_cidr }}"
            rule_desc: "SSH from lab operator"
          - proto: all
            group_name: "{{ aws_cluster_name }}-nodes"
            rule_desc: "Private node-to-node Kubernetes traffic"
        rules_egress:
          - proto: all
            cidr_ip: 0.0.0.0/0
      register: kubespray_sg

    - name: Resolve Ubuntu 24.04 AMI for this region
      ansible.builtin.set_fact:
        ubuntu_ami_id: >-
          {{ lookup('amazon.aws.ssm_parameter', ubuntu_ami_ssm_parameter,
                    region=aws_region, profile=aws_profile) }}

    - name: Get Ubuntu AMI root device name
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        image_ids:
          - "{{ ubuntu_ami_id }}"
      register: ubuntu_ami_info

    - name: Ensure the expected AMI was found
      ansible.builtin.assert:
        that:
          - ubuntu_ami_info.images | length == 1

    - name: Create EC2 master and worker instances
      amazon.aws.ec2_instance:
        name: "{{ aws_cluster_name }}-{{ item.name }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        instance_type: "{{ item.instance_type }}"
        image_id: "{{ ubuntu_ami_id }}"
        key_name: "{{ ec2_key_name }}"
        state: running
        exact_count: 1
        wait: true
        # Explicit tags prevent replacing nodes when the 'latest' AMI changes.
        filters:
          "tag:KubesprayCluster": "{{ aws_cluster_name }}"
          "tag:Node": "{{ item.name }}"
          "instance-state-name": [pending, running, stopping, stopped]
        network_interfaces:
          - device_index: 0
            subnet_id: >-
              {{ (default_subnets.subnets
                  | selectattr('availability_zone', 'equalto', item.zone)
                  | first).subnet_id }}
            groups:
              - "{{ kubespray_sg.group_id }}"
            assign_public_ip: true
            delete_on_termination: true
        volumes:
          - device_name: "{{ ubuntu_ami_info.images[0].root_device_name }}"
            ebs:
              volume_size: "{{ item.disk_gb | int }}"
              volume_type: "{{ item.disk_type }}"
              delete_on_termination: true
        metadata_options:
          http_tokens: required
        tags:
          KubesprayCluster: "{{ aws_cluster_name }}"
          Node: "{{ item.name }}"
          Role: "{{ item.role }}"
          ManagedBy: ansible
      loop: "{{ target_nodes }}"
      loop_control:
        label: "{{ item.name }} in {{ item.zone }}"
      register: created_instances

    - name: Query current EC2 instance IP addresses
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        filters:
          "tag:KubesprayCluster": "{{ aws_cluster_name }}"
          "instance-state-name": [running]
      register: ec2_info

    - name: Verify all selected nodes have a public IP
      ansible.builtin.assert:
        that:
          - matched | length == 1
          - matched[0].public_ip_address is defined
          - matched[0].private_ip_address is defined
        fail_msg: "{{ item.name }} has no unique running EC2 instance with public/private IP."
      vars:
        matched: "{{ ec2_info.instances | selectattr('tags.Node', 'equalto', item.name) | list }}"
      loop: "{{ target_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Generate Kubespray inventory from live EC2 data
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/inventory.ini.j2"
        dest: "{{ playbook_dir }}/../inventory.ini"
        mode: '0600'

    - name: Show generated inventory file
      ansible.builtin.debug:
        msg: "Created {{ playbook_dir }}/../inventory.ini. Test: ansible -i inventory.ini all -m ping"
