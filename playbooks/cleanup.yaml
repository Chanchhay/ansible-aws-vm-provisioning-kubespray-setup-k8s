---
- name: Delete AWS Kubespray EC2 lab resources
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - ../vars/aws.yaml
  vars:
    confirm_destroy: false
    target_node_names: [master01, master02, worker01, worker02]
    target_nodes: "{{ machines_info | selectattr('name', 'in', target_node_names) | list }}"
    # Only remove SG when all nodes in this cluster are gone.
    remove_security_group: false
    # Leave imported SSH key pair for reuse by default.
    remove_key_pair: false
  tasks:
    - name: Show deletion plan
      ansible.builtin.debug:
        msg:
          - "Region: {{ aws_region }}"
          - "Cluster: {{ aws_cluster_name }}"
          - "Delete nodes: {{ target_nodes | map(attribute='name') | list }}"
          - "Remove security group: {{ remove_security_group }}"
          - "Remove key pair: {{ remove_key_pair }}"

    - name: Require explicit destruction approval
      ansible.builtin.assert:
        that:
          - confirm_destroy | bool
          - target_nodes | length > 0
        fail_msg: "Refusing to delete. Set -e confirm_destroy=true and review targets first."

    - name: Terminate only this lab's tagged EC2 nodes
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        state: absent
        wait: true
        filters:
          "tag:KubesprayCluster": "{{ aws_cluster_name }}"
          "tag:Node": "{{ item.name }}"
          "instance-state-name": [pending, running, stopping, stopped]
      loop: "{{ target_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Delete lab security group if requested
      amazon.aws.ec2_security_group:
        name: "{{ aws_cluster_name }}-nodes"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        state: absent
      when: remove_security_group | bool

    - name: Delete imported EC2 key pair if requested
      amazon.aws.ec2_key:
        name: "{{ ec2_key_name }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        state: absent
      when: remove_key_pair | bool

    - name: Cleanup complete
      ansible.builtin.debug:
        msg: "Check EC2 and EBS; local inventory.ini is now stale."
