
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: react-ingress
  namespace: react-demo
  annotations:
    nginx.org/ssl-redirect: "true"
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - k8s.kagea.site
        - k8s-nginx.kagea.site
      secretName: kagea-site-tls

  rules:
    - host: k8s.kagea.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react-service
                port:
                  number: 80

    - host: k8s-nginx.kagea.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80
