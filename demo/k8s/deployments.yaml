apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
  namespace: react-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react-app
          image: chanchhayy/reactjs-sonar-webhook:v1.0.3
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
